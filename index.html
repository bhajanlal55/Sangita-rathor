<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Tunes HD 100X</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #00d26a;
      --bg: #0f111a;
      --card-bg: #1a1d2e;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 95px; }
    header {
      padding: 16px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .brand { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .search-bar {
      display: flex;
      background: var(--card-bg);
      border-radius: 25px;
      padding: 6px 16px;
      align-items: center;
      border: 1px solid #2d3748;
    }
    .search-bar input {
      border: none;
      background: transparent;
      outline: none;
      color: #fff;
      flex: 1;
      font-size: 15px;
      padding: 6px;
    }
    .search-bar button {
      background: transparent;
      border: none;
      color: var(--primary);
      font-size: 16px;
      cursor: pointer;
    }
    .count-badge {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      display: none;
    }
    .container { padding: 16px; }
    .song-list { display: flex; flex-direction: column; gap: 10px; }
    .song-item {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      gap: 12px;
    }
    .song-item:active { transform: scale(0.98); }
    .song-img {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
      background-color: #2a2e45;
    }
    .song-info { flex: 1; overflow: hidden; }
    .song-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .play-btn-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0, 210, 106, 0.15);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 75px;
      background: #141724;
      border-top: 1px solid #23273a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 1000;
    }
    .player-img { width: 46px; height: 46px; border-radius: 6px; object-fit: cover; background: #222; }
    .player-info { flex: 1; overflow: hidden; }
    .player-title { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-artist { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      cursor: pointer;
    }
    .status-msg { text-align: center; color: var(--text-sub); font-size: 14px; margin-top: 30px; }
  </style>
</head>
<body>

  <header>
    <div class="brand"><i class="fas fa-headphones-alt"></i> AR Tunes HD</div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search Sidhu Moose Wala, Karan Aujla..." />
      <button onclick="startSearch()"><i class="fas fa-search"></i></button>
    </div>
  </header>

  <div class="container">
    <div id="countBadge" class="count-badge"></div>
    <div id="statusMsg" class="status-msg">Type a song name above to listen</div>
    <div class="song-list" id="songList"></div>
  </div>

  <div class="player-bar" id="playerBar" style="display: none;">
    <img id="trackImg" class="player-img" src="" />
    <div class="player-info">
      <div class="player-title" id="trackTitle">Song Name</div>
      <div class="player-artist" id="trackArtist">Artist</div>
    </div>
    <button class="player-btn" onclick="togglePlay()"><i id="playIcon" class="fas fa-play"></i></button>
  </div>

  <audio id="audioElement"></audio>

  <script>
    const audio = document.getElementById("audioElement");
    let isPlaying = false;

    document.getElementById("searchInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") startSearch();
    });

    // 4 अलग-अलग हाई-स्पीड JioSaavn प्रोडक्शन क्लस्टर एंडपॉइंट्स (No-CORS Blocks)
    const API_SERVERS = [
      "https://saavn.dev/api",
      "https://saavn.me",
      "https://jiosaavn-api-privatecvc2.vercel.app",
      "https://jiosaavn-api-tau-three.vercel.app"
    ];

    async function queryMirror(endpoint, query, page) {
      for (const base of API_SERVERS) {
        try {
          let url = "";
          if (base.includes("/api")) {
            url = `${base}/search/songs?query=${encodeURIComponent(query)}&page=${page}&limit=50`;
          } else if (base.includes("tau-three")) {
            url = `${base}/song/?query=${encodeURIComponent(query)}`;
          } else {
            url = `${base}/search/songs?query=${encodeURIComponent(query)}&page=${page}&limit=50`;
          }

          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            const results = data?.data?.results || data?.results || (Array.isArray(data) ? data : (data.result ? data.result : []));
            if (results && results.length > 0) return results;
          }
        } catch (err) {
          // अगले मिरर पर स्विच करें
          continue;
        }
      }
      return [];
    }

    async function startSearch() {
      const q = document.getElementById("searchInput").value.trim();
      if (!q) return;

      const msg = document.getElementById("statusMsg");
      const list = document.getElementById("songList");
      const badge = document.getElementById("countBadge");

      msg.style.display = "block";
      badge.style.display = "none";
      msg.innerText = "⚡ Loading full catalog...";
      list.innerHTML = "";

      // Page 1 और Page 2 दोनों को पैरेलल फेच करके 100 गाने बनाना
      const [resPage1, resPage2] = await Promise.all([
        queryMirror(API_SERVERS, q, 1),
        queryMirror(API_SERVERS, q, 2)
      ]);

      let rawSongs = [...resPage1, ...resPage2];

      // Deduplication: डुप्लीकेट गानों को फ़िल्टर करना
      const uniqueMap = new Map();
      rawSongs.forEach(song => {
        const title = (song.name || song.song || song.title || "").trim().toLowerCase();
        const id = song.id || title;
        if (title && !uniqueMap.has(id)) {
          uniqueMap.set(id, song);
        }
      });

      const uniqueSongs = Array.from(uniqueMap.values());

      if (uniqueSongs.length === 0) {
        msg.innerText = "No songs found. Please try another search.";
        return;
      }

      msg.style.display = "none";
      badge.style.display = "block";
      badge.innerText = `🔥 Total Songs Loaded: ${uniqueSongs.length}`;

      uniqueSongs.forEach((item, index) => {
        // बेस्ट 320kbps / डायरेक्ट CDN लिंक एक्सट्रैक्टर
        let streamUrl = "";
        if (item.downloadUrl && Array.isArray(item.downloadUrl)) {
          streamUrl = item.downloadUrl[item.downloadUrl.length - 1]?.url || item.downloadUrl[0]?.url || "";
        } else if (typeof item.downloadUrl === "string") {
          streamUrl = item.downloadUrl;
        } else if (item.media_url) {
          streamUrl = item.media_url;
        }

        // HD इमेज एक्सट्रैक्टर
        let img = "";
        if (item.image && Array.isArray(item.image)) {
          img = item.image[item.image.length - 1]?.url || item.image[0]?.url || "";
        } else if (typeof item.image === "string") {
          img = item.image;
        } else if (item.album_art) {
          img = item.album_art;
        }

        const title = (item.name || item.song || item.title || `Track ${index + 1}`)
          .replace(/&quot;/g, '"')
          .replace(/&amp;/g, '&')
          .replace(/&#039;/g, "'");

        const artist = (item.artists?.primary?.[0]?.name || item.primaryArtists || item.singers || item.artist || "JioSaavn")
          .replace(/&quot;/g, '"')
          .replace(/&amp;/g, '&')
          .replace(/&#039;/g, "'");

        const div = document.createElement("div");
        div.className = "song-item";
        div.innerHTML = `
          <img src="${img || 'https://via.placeholder.com/150'}" class="song-img" loading="lazy" />
          <div class="song-info">
            <div class="song-title">${index + 1}. ${title}</div>
            <div class="song-artist">${artist}</div>
          </div>
          <div class="play-btn-circle"><i class="fas fa-play"></i></div>
        `;

        div.onclick = () => {
          if (streamUrl) {
            playAudio(streamUrl, title, artist, img);
          } else {
            alert("Stream not available for this song.");
          }
        };

        list.appendChild(div);
      });
    }

    function playAudio(url, title, artist, img) {
      audio.src = url;
      audio.play();
      isPlaying = true;
      document.getElementById("playerBar").style.display = "flex";
      document.getElementById("trackTitle").innerText = title;
      document.getElementById("trackArtist").innerText = artist;
      document.getElementById("trackImg").src = img || "";
      document.getElementById("playIcon").className = "fas fa-pause";
    }

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        document.getElementById("playIcon").className = "fas fa-play";
      } else {
        audio.play();
        document.getElementById("playIcon").className = "fas fa-pause";
      }
      isPlaying = !isPlaying;
    }

    audio.onended = () => {
      isPlaying = false;
      document.getElementById("playIcon").className = "fas fa-play";
    };
  </script>
</body>
</html>
