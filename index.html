<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Tunes HD 100X</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #00d26a;
      --bg: #0f111a;
      --card-bg: #1a1d2e;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 95px; }
    header {
      padding: 16px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .brand { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .search-bar {
      display: flex;
      background: var(--card-bg);
      border-radius: 25px;
      padding: 6px 16px;
      align-items: center;
      border: 1px solid #2d3748;
    }
    .search-bar input {
      border: none;
      background: transparent;
      outline: none;
      color: #fff;
      flex: 1;
      font-size: 15px;
      padding: 6px;
    }
    .search-bar button {
      background: transparent;
      border: none;
      color: var(--primary);
      font-size: 16px;
      cursor: pointer;
    }
    .count-badge {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      display: none;
    }
    .container { padding: 16px; }
    .song-list { display: flex; flex-direction: column; gap: 10px; }
    .song-item {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      gap: 12px;
    }
    .song-item:active { transform: scale(0.98); }
    .song-img {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
      background-color: #2a2e45;
    }
    .song-info { flex: 1; overflow: hidden; }
    .song-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .play-btn-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0, 210, 106, 0.15);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 75px;
      background: #141724;
      border-top: 1px solid #23273a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 1000;
    }
    .player-img { width: 46px; height: 46px; border-radius: 6px; object-fit: cover; background: #222; }
    .player-info { flex: 1; overflow: hidden; }
    .player-title { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-artist { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      cursor: pointer;
    }
    .status-msg { text-align: center; color: var(--text-sub); font-size: 14px; margin-top: 30px; }
  </style>
</head>
<body>

  <header>
    <div class="brand"><i class="fas fa-headphones-alt"></i> AR Tunes HD</div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search Sidhu Moose Wala, Karan Aujla..." />
      <button onclick="startSearch()"><i class="fas fa-search"></i></button>
    </div>
  </header>

  <div class="container">
    <div id="countBadge" class="count-badge"></div>
    <div id="statusMsg" class="status-msg">Type a song name above to listen</div>
    <div class="song-list" id="songList"></div>
  </div>

  <div class="player-bar" id="playerBar" style="display: none;">
    <img id="trackImg" class="player-img" src="" />
    <div class="player-info">
      <div class="player-title" id="trackTitle">Song Name</div>
      <div class="player-artist" id="trackArtist">Artist</div>
    </div>
    <button class="player-btn" onclick="togglePlay()"><i id="playIcon" class="fas fa-play"></i></button>
  </div>

  <audio id="audioElement" preload="auto"></audio>

  <script>
    const audio = document.getElementById("audioElement");
    let isPlaying = false;

    document.getElementById("searchInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") startSearch();
    });

    const API_SERVERS = [
      "https://saavn.dev/api",
      "https://saavn.me",
      "https://jiosaavn-api-privatecvc2.vercel.app"
    ];

    async function queryMirror(query, page) {
      for (const base of API_SERVERS) {
        try {
          const url = `${base}/search/songs?query=${encodeURIComponent(query)}&page=${page}&limit=50`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            const results = data?.data?.results || data?.results || [];
            if (results && results.length > 0) return results;
          }
        } catch (err) {}
      }
      return [];
    }

    // डायरेक्ट प्ले करने योग्य URL निकालना
    function extractStreamUrl(item) {
      // 1. Check downloadUrl / download_url array (Highest Quality)
      const list = item.downloadUrl || item.download_url;
      if (Array.isArray(list) && list.length > 0) {
        // 320kbps या 160kbps लिंक
        for (let i = list.length - 1; i >= 0; i--) {
          const u = typeof list[i] === 'string' ? list[i] : (list[i].url || list[i].link);
          if (u && (u.startsWith("http://") || u.startsWith("https://"))) {
            return u.replace("http://", "https://");
          }
        }
      }

      // 2. Check direct media URL string
      let direct = item.media_url || item.url || item.media_preview_url || "";
      if (direct && typeof direct === 'string' && direct.startsWith("http")) {
        return direct.replace("http://", "https://");
      }

      return "";
    }

    async function startSearch() {
      const q = document.getElementById("searchInput").value.trim();
      if (!q) return;

      const msg = document.getElementById("statusMsg");
      const list = document.getElementById("songList");
      const badge = document.getElementById("countBadge");

      msg.style.display = "block";
      badge.style.display = "none";
      msg.innerText = "⚡ Loading 100 songs...";
      list.innerHTML = "";

      const [p1, p2] = await Promise.all([
        queryMirror(q, 1),
        queryMirror(q, 2)
      ]);

      let rawSongs = [...p1, ...p2];

      const uniqueMap = new Map();
      rawSongs.forEach(song => {
        const title = (song.name || song.song || song.title || "").trim().toLowerCase();
        const id = song.id || title;
        if (title && !uniqueMap.has(id)) {
          uniqueMap.set(id, song);
        }
      });

      const uniqueSongs = Array.from(uniqueMap.values());

      if (uniqueSongs.length === 0) {
        msg.innerText = "No songs found. Please try another search.";
        return;
      }

      msg.style.display = "none";
      badge.style.display = "block";
      badge.innerText = `🔥 Total Songs Loaded: ${uniqueSongs.length}`;

      uniqueSongs.forEach((item, index) => {
        let streamUrl = extractStreamUrl(item);

        let img = "";
        const imgArr = item.image || item.album_art;
        if (Array.isArray(imgArr) && imgArr.length > 0) {
          const last = imgArr[imgArr.length - 1];
          img = typeof last === 'string' ? last : (last.url || last.link);
        } else if (typeof imgArr === "string") {
          img = imgArr;
        }

        const title = (item.name || item.song || item.title || `Track ${index + 1}`)
          .replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&#039;/g, "'");

        const artist = (item.artists?.primary?.[0]?.name || item.primaryArtists || item.singers || item.artist || "JioSaavn")
          .replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&#039;/g, "'");

        const div = document.createElement("div");
        div.className = "song-item";
        div.innerHTML = `
          <img src="${img || 'https://via.placeholder.com/150'}" class="song-img" loading="lazy" />
          <div class="song-info">
            <div class="song-title">${index + 1}. ${title}</div>
            <div class="song-artist">${artist}</div>
          </div>
          <div class="play-btn-circle"><i class="fas fa-play"></i></div>
        `;

        div.onclick = async () => {
          // अगर लिस्ट में लिंक नहीं मिला, तो सीधे ID से 1-क्लिक में लाइव लिंक फेच करें
          if (!streamUrl && item.id) {
            msg.style.display = "block";
            msg.innerText = "Loading audio stream...";
            try {
              const res = await fetch(`https://saavn.dev/api/songs?id=${item.id}`);
              const d = await res.json();
              const songObj = d?.data?.[0] || d?.data || d?.[0];
              if (songObj) {
                streamUrl = extractStreamUrl(songObj);
              }
            } catch(e) {}
            msg.style.display = "none";
          }

          if (streamUrl) {
            playAudio(streamUrl, title, artist, img);
          } else {
            alert("Streaming link unavailable for this track.");
          }
        };

        list.appendChild(div);
      });
    }

    function playAudio(url, title, artist, img) {
      audio.pause();
      audio.src = url;
      audio.load();

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            isPlaying = true;
            document.getElementById("playIcon").className = "fas fa-pause";
          })
          .catch(err => {
            // ऑटोप्ले ब्लॉक या फ़ॉर्मैट इश्यू होने पर बैकअप 160kbps लिंक ट्राई करें
            if (url.includes("_320.mp4")) {
              audio.src = url.replace("_320.mp4", "_160.mp4");
              audio.play();
              isPlaying = true;
              document.getElementById("playIcon").className = "fas fa-pause";
            }
          });
      }

      document.getElementById("playerBar").style.display = "flex";
      document.getElementById("trackTitle").innerText = title;
      document.getElementById("trackArtist").innerText = artist;
      document.getElementById("trackImg").src = img || "";
    }

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        document.getElementById("playIcon").className = "fas fa-play";
      } else {
        audio.play();
        document.getElementById("playIcon").className = "fas fa-pause";
      }
      isPlaying = !isPlaying;
    }

    audio.onended = () => {
      isPlaying = false;
      document.getElementById("playIcon").className = "fas fa-play";
    };

    audio.onerror = () => {
      document.getElementById("playIcon").className = "fas fa-play";
      isPlaying = false;
    };
  </script>
</body>
</html>
