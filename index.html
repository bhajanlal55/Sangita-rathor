<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Tunes HD</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #00d26a;
      --bg: #0f111a;
      --card-bg: #1a1d2e;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 95px; }
    header {
      padding: 16px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .brand { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .search-bar {
      display: flex;
      background: var(--card-bg);
      border-radius: 25px;
      padding: 6px 16px;
      align-items: center;
      border: 1px solid #2d3748;
    }
    .search-bar input {
      border: none;
      background: transparent;
      outline: none;
      color: #fff;
      flex: 1;
      font-size: 15px;
      padding: 6px;
    }
    .search-bar button {
      background: transparent;
      border: none;
      color: var(--primary);
      font-size: 16px;
      cursor: pointer;
    }
    .container { padding: 16px; }
    .song-list { display: flex; flex-direction: column; gap: 10px; }
    .song-item {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      gap: 12px;
    }
    .song-item:active { transform: scale(0.98); }
    .song-img {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
      background-color: #2a2e45;
    }
    .song-info { flex: 1; overflow: hidden; }
    .song-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .play-btn-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0, 210, 106, 0.15);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 75px;
      background: #141724;
      border-top: 1px solid #23273a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 1000;
    }
    .player-img { width: 46px; height: 46px; border-radius: 6px; object-fit: cover; background: #222; }
    .player-info { flex: 1; overflow: hidden; }
    .player-title { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-artist { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      cursor: pointer;
    }
    .status-msg { text-align: center; color: var(--text-sub); font-size: 14px; margin-top: 30px; }
  </style>
</head>
<body>

  <header>
    <div class="brand"><i class="fas fa-headphones-alt"></i> AR Tunes HD</div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search Sidhu Moose Wala, Karan Aujla..." />
      <button onclick="searchMusic()"><i class="fas fa-search"></i></button>
    </div>
  </header>

  <div class="container">
    <div id="statusMsg" class="status-msg">Type a song name above to listen</div>
    <div class="song-list" id="songList"></div>
  </div>

  <div class="player-bar" id="playerBar" style="display: none;">
    <img id="trackImg" class="player-img" src="" />
    <div class="player-info">
      <div class="player-title" id="trackTitle">Song Name</div>
      <div class="player-artist" id="trackArtist">Artist</div>
    </div>
    <button class="player-btn" onclick="togglePlay()"><i id="playIcon" class="fas fa-play"></i></button>
  </div>

  <audio id="audioElement"></audio>

  <script>
    const MY_VERCEL_API = "https://jiosaavn-api-tau-three.vercel.app";
    const audio = document.getElementById("audioElement");
    let isPlaying = false;

    document.getElementById("searchInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") searchMusic();
    });

    async function searchMusic() {
      const q = document.getElementById("searchInput").value.trim();
      if (!q) return;

      const msg = document.getElementById("statusMsg");
      const list = document.getElementById("songList");
      msg.style.display = "block";
      msg.innerText = "Loading 100+ songs...";
      list.innerHTML = "";

      let allSongs = [];

      try {
        // Page 1 और Page 2 दोनों से 50-50 गाने लाकर 100 गाने बनाना
        const [res1, res2] = await Promise.all([
          fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(q)}&page=1&limit=50`).then(r => r.json()).catch(() => null),
          fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(q)}&page=2&limit=50`).then(r => r.json()).catch(() => null)
        ]);

        if (res1?.data?.results) allSongs.push(...res1.data.results);
        if (res2?.data?.results) allSongs.push(...res2.data.results);

        // बैकअप Fallback अगर saavn.dev व्यस्त हो
        if (allSongs.length === 0) {
          const fallbackRes = await fetch(`${MY_VERCEL_API}/song/?query=${encodeURIComponent(q)}`);
          const fbData = await fallbackRes.json();
          if (Array.isArray(fbData)) allSongs = fbData;
        }

        if (allSongs.length === 0) {
          msg.innerText = "No songs found.";
          return;
        }

        msg.style.display = "none";

        allSongs.forEach(item => {
          // 320kbps या बेस्ट क्वालिटी लिंक चुनना
          let streamUrl = "";
          if (item.downloadUrl && Array.isArray(item.downloadUrl)) {
            streamUrl = item.downloadUrl[item.downloadUrl.length - 1]?.url || "";
          } else if (item.media_url) {
            streamUrl = item.media_url;
          }

          let img = "";
          if (item.image && Array.isArray(item.image)) {
            img = item.image[item.image.length - 1]?.url || "";
          } else if (typeof item.image === "string") {
            img = item.image;
          }

          const title = (item.name || item.song || item.title || "Song").replace(/&quot;/g, '"').replace(/&amp;/g, '&');
          const artist = (item.artists?.primary?.[0]?.name || item.singers || item.primary_artists || item.artist || "Artist").replace(/&quot;/g, '"');

          const div = document.createElement("div");
          div.className = "song-item";

          div.innerHTML = `
            <img src="${img || 'https://via.placeholder.com/150'}" class="song-img" loading="lazy" />
            <div class="song-info">
              <div class="song-title">${title}</div>
              <div class="song-artist">${artist}</div>
            </div>
            <div class="play-btn-circle"><i class="fas fa-play"></i></div>
          `;

          div.onclick = async () => {
            let finalUrl = streamUrl;
            // यदि डाउनलोड लिंक सीधा उपलब्ध न हो, तो Vercel API से फेच करें
            if (!finalUrl && (item.id || item.url)) {
              try {
                const singleRes = await fetch(`${MY_VERCEL_API}/song/?id=${item.id || ''}&url=${encodeURIComponent(item.url || '')}`);
                const singleData = await singleRes.json();
                finalUrl = singleData.media_url || singleData[0]?.media_url || "";
              } catch(e) {}
            }

            if (finalUrl) {
              playAudio(finalUrl, title, artist, img);
            } else {
              alert("Playing track...");
            }
          };

          list.appendChild(div);
        });

      } catch (err) {
        msg.innerText = "Error loading songs. Please try again.";
      }
    }

    function playAudio(url, title, artist, img) {
      audio.src = url;
      audio.play();
      isPlaying = true;
      document.getElementById("playerBar").style.display = "flex";
      document.getElementById("trackTitle").innerText = title;
      document.getElementById("trackArtist").innerText = artist;
      document.getElementById("trackImg").src = img;
      document.getElementById("playIcon").className = "fas fa-pause";
    }

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        document.getElementById("playIcon").className = "fas fa-play";
      } else {
        audio.play();
        document.getElementById("playIcon").className = "fas fa-pause";
      }
      isPlaying = !isPlaying;
    }

    audio.onended = () => {
      isPlaying = false;
      document.getElementById("playIcon").className = "fas fa-play";
    };
  </script>
</body>
</html>
