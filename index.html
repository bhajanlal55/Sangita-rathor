<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>AR Tunes - Sangita Rathore</title>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Client-Side Decryption Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-purple: #b026ff;
            --neon-cyan: #00f0ff;
            --paper: #ffffff;
            --paper-dim: rgba(255, 255, 255, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            background: #000;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .app-shell {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            background: linear-gradient(135deg, var(--neon-pink) 0%, var(--neon-purple) 45%, var(--neon-cyan) 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            filter: contrast(1.12) brightness(1.05);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px 8px 20px;
            z-index: 10;
        }

        .header-title-block { text-align: center; flex: 1; }
        .app-header h3 { font-size: 11px; color: var(--paper-dim); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
        .app-header p { font-size: 14px; color: var(--paper); font-weight: 700; margin-top: 1px; }

        .back-nav-arrow, .header-options-btn {
            background: transparent;
            border: none;
            color: var(--paper);
            font-size: 19px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-player-body {
            flex: 1;
            padding: 5px 20px 20px 20px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .poster-wrapper {
            width: 100%;
            aspect-ratio: 1/1;
            max-width: 310px;
            margin: 0 auto 6px auto;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .main-poster { width: 100%; height: 100%; object-fit: cover; }

        .buffering-overlay-spinner {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: var(--paper);
            font-size: 36px;
        }

        .poster-wrapper.buffering .buffering-overlay-spinner { display: flex; }
        .rotate-infinite-loop { animation: rotateFrame 1s linear infinite; }
        @keyframes rotateFrame { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .track-meta-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }

        .track-meta-info { flex: 1; overflow: hidden; padding-right: 15px; }
        .track-meta-info h2 { font-size: 19px; font-weight: 800; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-meta-info p { font-size: 13px; color: var(--paper-dim); font-weight: 500; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .meta-action-icons { display: flex; align-items: center; gap: 14px; }
        .meta-btn { background: transparent; border: none; color: var(--paper); font-size: 20px; cursor: pointer; }
        .like-heart-btn.liked { color: #ff1744; filter: drop-shadow(0 0 8px rgba(255, 23, 68, 0.8)); }

        .timeline-container { width: 100%; margin: 6px 0; }
        .custom-slider {
            width: 100%;
            -webkit-appearance: none;
            height: 4px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 2px;
            outline: none;
        }

        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--paper);
            cursor: pointer;
        }

        .time-counter-display { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--paper-dim); margin-top: 4px; }

        .bass-control-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 14px;
            border-radius: 12px;
        }
        .bass-control-panel label { font-size: 10px; font-weight: 800; color: var(--paper); text-transform: uppercase; }

        .media-buttons-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 6px 4px;
        }

        .nav-btn { background: transparent; border: none; color: var(--paper); font-size: 24px; cursor: pointer; }
        .mode-toggle-btn { background: transparent; border: none; color: rgba(255, 255, 255, 0.45); font-size: 18px; cursor: pointer; }
        .mode-toggle-btn.active { color: #00e5ff; text-shadow: 0 0 8px rgba(0, 229, 255, 0.8); }

        .master-play-globe {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: var(--paper);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        .bottom-utility-dock { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
        .dock-icon-btn { background: transparent; border: none; color: var(--paper-dim); font-size: 19px; cursor: pointer; }

        .liked-songs-overlay, .search-page-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, #1f0513 0%, #140424 50%, #021a24 100%);
            z-index: 500;
            padding: 20px;
            display: none;
            flex-direction: column;
        }

        .search-page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .input-box-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .input-box-container input { background: transparent; border: none; outline: 0; color: var(--paper); font-size: 14px; font-weight: 600; flex: 1; }

        .search-results-viewport { flex: 1; overflow-y: auto !important; padding-bottom: 20px; }
        .bright-song-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .card-info { display: flex; align-items: center; gap: 12px; flex: 1; overflow: hidden; }
        .card-art { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; }
        .card-titles { flex: 1; overflow: hidden; padding-right: 8px; }
        .card-main-title { font-size: 14px; font-weight: 700; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-sub-artist { font-size: 12px; color: var(--paper-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <div class="app-shell" id="mainWrapper">
        <div class="app-header">
            <button class="back-nav-arrow" onclick="openSearchPageOverlay(true)"><i class="fas fa-search"></i></button>
            <div class="header-title-block">
                <h3>PLAYING FROM INTEREST</h3>
                <p>AR Tunes • Sangita Rathore</p>
            </div>
            <button class="header-options-btn" onclick="openLikedSongsOverlay(true)"><i class="fas fa-heart" style="color: #ff1744;"></i></button>
        </div>

        <div class="main-player-body">
            <div class="poster-wrapper" id="posterWrapper">
                <div class="buffering-overlay-spinner"><i class="fas fa-circle-notch rotate-infinite-loop"></i></div>
                <img alt="Art" class="main-poster" id="playerTrackPoster" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500">
            </div>

            <div class="track-meta-section">
                <div class="track-meta-info">
                    <h2 id="playerSongTitle">52 Gaj Ka Daman</h2>
                    <p id="playerArtistTitle">Renuka Panwar</p>
                </div>
                <div class="meta-action-icons">
                    <button class="meta-btn like-heart-btn" onclick="toggleLikeAction()" id="heartBtn"><i class="fas fa-heart"></i></button>
                </div>
            </div>

            <div class="timeline-container">
                <input id="trackTimelineSlider" class="custom-slider" max="100" min="0" type="range" value="0">
                <div class="time-counter-display">
                    <span id="lblCurrentTime">0:00</span>
                    <span id="lblTotalDuration">0:00</span>
                </div>
            </div>

            <div class="bass-control-panel">
                <label><i class="fas fa-bolt"></i> BASS</label>
                <input id="bassSliderInput" class="custom-slider" max="20" min="0" type="range" value="6" oninput="setBassGain(this.value)">
            </div>

            <div class="media-buttons-row">
                <button class="mode-toggle-btn" onclick="toggleShuffleMode()" id="shuffleBtn"><i class="fas fa-random"></i></button>
                <button class="nav-btn" onclick="playPrevTrack()"><i class="fas fa-step-backward"></i></button>
                <div class="master-play-globe" onclick="togglePlay()"><i class="fas fa-play" id="globePlayIcon"></i></div>
                <button class="nav-btn" onclick="playNextTrack()"><i class="fas fa-step-forward"></i></button>
                <button class="mode-toggle-btn" onclick="toggleRepeatMode()" id="repeatBtn"><i class="fas fa-redo"></i></button>
            </div>

            <div class="bottom-utility-dock">
                <button class="dock-icon-btn" onclick="openSearchPageOverlay(true)"><i class="fas fa-search"></i></button>
                <button class="dock-icon-btn" onclick="openLikedSongsOverlay(true)"><i class="fas fa-list-ul"></i></button>
            </div>
        </div>

        <div class="search-page-overlay" id="searchPageScreen">
            <div class="search-page-header">
                <button class="dock-icon-btn" onclick="openSearchPageOverlay(false)"><i class="fas fa-chevron-left"></i></button>
                <div class="input-box-container">
                    <input id="dynamicSearchQueryInput" placeholder="Search Haryanvi, Sidhu, Bollywood...">
                    <i class="fas fa-search" style="color:var(--paper-dim)"></i>
                </div>
            </div>
            <div class="search-results-viewport" id="searchResultsContainer"></div>
        </div>

        <div class="liked-songs-overlay" id="likedSongsScreen">
            <div class="search-page-header">
                <button class="dock-icon-btn" onclick="openLikedSongsOverlay(false)"><i class="fas fa-chevron-left"></i></button>
                <div class="track-meta-info" style="margin-left:8px">
                    <h2 style="font-size:18px">Your Library</h2>
                    <p style="font-size:12px; color:#00e5ff">Sangita Rathore Collection</p>
                </div>
            </div>
            <div class="search-results-viewport" id="likedSongsContainer"></div>
        </div>
    </div>

    <audio id="coreAudio"></audio>

    <script>
        const SAAVN_SECRET_KEY = CryptoJS.enc.Utf8.parse('38346591');

        function decryptMediaUrl(encryptedUrl) {
            if (!encryptedUrl) return '';
            try {
                const decrypted = CryptoJS.DES.decrypt(
                    { ciphertext: CryptoJS.enc.Base64.parse(encryptedUrl) },
                    SAAVN_SECRET_KEY,
                    { mode: CryptoJS.mode.ECB, padding: CryptoJS.pad.Pkcs7 }
                );
                let directUrl = decrypted.toString(CryptoJS.enc.Utf8);
                if (directUrl && directUrl.startsWith('http')) {
                    return directUrl.replace('_96.mp4', '_320.mp4');
                }
            } catch (e) {}
            return '';
        }

        let currentQueue = [];
        let currentIndex = -1;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;
        let timelineLock = false;
        let searchTimer = null;
        let favorites = JSON.parse(localStorage.getItem('ar_fav_songs')) || [];

        const audio = document.getElementById('coreAudio');
        let audioCtx, bassNode, sourceNode;

        function initWebAudio() {
            if (audioCtx) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                sourceNode = audioCtx.createMediaElementSource(audio);
                bassNode = audioCtx.createBiquadFilter();
                bassNode.type = "lowshelf";
                bassNode.frequency.value = 200;
                bassNode.gain.value = 6;
                sourceNode.connect(bassNode);
                bassNode.connect(audioCtx.destination);
            } catch (e) {}
        }

        function setBassGain(val) {
            if (bassNode) bassNode.gain.value = parseFloat(val);
        }

        window.addEventListener('DOMContentLoaded', () => {
            setupAudioEvents();
            setupSearch();
            setupTimeline();
            searchJioSaavn('Bollywood Trending Hits', (tracks) => {
                if (tracks && tracks.length > 0) {
                    currentQueue = tracks;
                    currentIndex = 0;
                    loadSongData(currentQueue[0], false);
                }
            });
        });

        function searchJioSaavn(query, callback) {
            window.saavnCallback = function(data) {
                let results = data.results || data.data?.results || [];
                let tracks = results.map(item => {
                    let moreInfo = item.more_info || {};
                    let encUrl = moreInfo.encrypted_media_url || item.encrypted_media_url || '';
                    let audioUrl = decryptMediaUrl(encUrl);
                    if (!audioUrl) {
                        let prev = moreInfo.media_preview_url || item.media_preview_url || '';
                        if (prev) audioUrl = prev.replace('preview.saavncdn.com', 'aac.saavncdn.com').replace('_96_p.mp4', '_320.mp4');
                    }
                    let image = item.image ? item.image.replace('150x150', '500x500') : 'https://placehold.co/500x500/181818/ffffff?text=AR+Tunes';
                    let artist = moreInfo.primary_artists || moreInfo.singers || item.primary_artists || item.singers || 'Artist';

                    return {
                        id: String(item.id),
                        name: (item.song || item.title || 'Song').replace(/&quot;/g, '"').replace(/&#039;/g, "'").replace(/&amp;/g, '&'),
                        artist: artist.replace(/&quot;/g, '"').replace(/&#039;/g, "'").replace(/&amp;/g, '&'),
                        image: image,
                        audioUrl: audioUrl
                    };
                }).filter(t => t.audioUrl !== '');
                callback(tracks);
            };

            const script = document.createElement('script');
            script.src = `https://www.jiosaavn.com/api.php?__call=search.getSongResults&_format=json&_marker=0&api_version=4&p=1&n=50&q=${encodeURIComponent(query)}&callback=saavnCallback`;
            document.body.appendChild(script);
        }

        function loadSongData(track, autoPlay = true) {
            if (!track || !track.audioUrl) return;
            document.getElementById('posterWrapper').classList.add('buffering');
            audio.src = track.audioUrl;
            document.getElementById('playerSongTitle').innerText = track.name;
            document.getElementById('playerArtistTitle').innerText = track.artist;
            document.getElementById('playerTrackPoster').src = track.image;
            updateLikeButtonState(track.id);

            if (autoPlay) {
                initWebAudio();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                audio.play().then(() => updatePlayState(true)).catch(() => updatePlayState(false));
            }
        }

        function togglePlay() {
            if (!audio.src) return;
            initWebAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if (audio.paused) {
                audio.play();
                updatePlayState(true);
            } else {
                audio.pause();
                updatePlayState(false);
            }
        }

        function updatePlayState(playing) {
            document.getElementById('globePlayIcon').className = playing ? "fas fa-pause" : "fas fa-play";
        }

        function playNextTrack() {
            if (!currentQueue.length) return;
            currentIndex = isShuffle ? Math.floor(Math.random() * currentQueue.length) : (currentIndex + 1) % currentQueue.length;
            loadSongData(currentQueue[currentIndex], true);
        }

        function playPrevTrack() {
            if (!currentQueue.length) return;
            currentIndex = (currentIndex - 1 + currentQueue.length) % currentQueue.length;
            loadSongData(currentQueue[currentIndex], true);
        }

        function toggleShuffleMode() {
            isShuffle = !isShuffle;
            document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
        }

        function toggleRepeatMode() {
            isRepeat = !isRepeat;
            document.getElementById('repeatBtn').classList.toggle('active', isRepeat);
        }

        function setupTimeline() {
            const slider = document.getElementById('trackTimelineSlider');
            slider.addEventListener('input', () => { timelineLock = true; });
            slider.addEventListener('change', (e) => {
                timelineLock = false;
                if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
            });
        }

        function setupAudioEvents() {
            audio.addEventListener('playing', () => {
                document.getElementById('posterWrapper').classList.remove('buffering');
                updatePlayState(true);
            });
            audio.addEventListener('waiting', () => {
                document.getElementById('posterWrapper').classList.add('buffering');
            });
            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    if (!timelineLock) {
                        document.getElementById('trackTimelineSlider').value = (audio.currentTime / audio.duration) * 100;
                    }
                    document.getElementById('lblCurrentTime').innerText = formatTime(audio.currentTime);
                    document.getElementById('lblTotalDuration').innerText = formatTime(audio.duration);
                }
            });
            audio.addEventListener('ended', () => {
                if (isRepeat) { audio.currentTime = 0; audio.play(); }
                else playNextTrack();
            });
        }

        function formatTime(s) {
            if (isNaN(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function setupSearch() {
            const input = document.getElementById('dynamicSearchQueryInput');
            input.addEventListener('input', (e) => {
                clearTimeout(searchTimer);
                const q = e.target.value.trim();
                if (!q) return;

                searchTimer = setTimeout(() => {
                    const list = document.getElementById('searchResultsContainer');
                    list.innerHTML = '<p style="color:var(--paper-dim); text-align:center; padding:30px;">सर्च हो रहा है...</p>';
                    searchJioSaavn(q, (songs) => {
                        list.innerHTML = '';
                        if (!songs || songs.length === 0) {
                            list.innerHTML = '<p style="color:var(--paper-dim); text-align:center; padding:30px;">कोई गाना नहीं मिला</p>';
                            return;
                        }
                        songs.forEach(song => {
                            const card = document.createElement('div');
                            card.className = 'bright-song-card';
                            card.onclick = () => {
                                currentQueue = songs;
                                currentIndex = songs.findIndex(s => s.id === song.id);
                                loadSongData(song, true);
                                openSearchPageOverlay(false);
                            };
                            card.innerHTML = `
                                <div class="card-info">
                                    <img class="card-art" src="${song.image}">
                                    <div class="card-titles">
                                        <div class="card-main-title">${song.name}</div>
                                        <div class="card-sub-artist">${song.artist}</div>
                                    </div>
                                </div>
                                <i class="fas fa-play-circle" style="color:var(--paper); font-size: 20px;"></i>
                            `;
                            list.appendChild(card);
                        });
                    });
                }, 400);
            });
        }

        function openSearchPageOverlay(show) {
            document.getElementById('searchPageScreen').style.display = show ? 'flex' : 'none';
        }

        function openLikedSongsOverlay(show) {
            document.getElementById('likedSongsScreen').style.display = show ? 'flex' : 'none';
            if (show) renderFavoritesList();
        }

        function toggleLikeAction() {
            const track = currentQueue[currentIndex];
            if (!track) return;
            const idx = favorites.findIndex(f => f.id === track.id);
            if (idx > -1) favorites.splice(idx, 1);
            else favorites.unshift(track);
            localStorage.setItem('ar_fav_songs', JSON.stringify(favorites));
            updateLikeButtonState(track.id);
        }

        function updateLikeButtonState(id) {
            const isFav = favorites.some(f => f.id === id);
            document.getElementById('heartBtn').classList.toggle('liked', isFav);
        }

        function renderFavoritesList() {
            const list = document.getElementById('likedSongsContainer');
            list.innerHTML = '';
            if (favorites.length === 0) {
                list.innerHTML = '<p style="color:var(--paper-dim); text-align:center; padding:40px;">लाइब्रेरी खाली है।</p>';
                return;
            }
            favorites.forEach(song => {
                const card = document.createElement('div');
                card.className = 'bright-song-card';
                card.onclick = () => {
                    currentQueue = favorites;
                    currentIndex = favorites.findIndex(s => s.id === song.id);
                    loadSongData(song, true);
                    openLikedSongsOverlay(false);
                };
                card.innerHTML = `
                    <div class="card-info">
                        <img class="card-art" src="${song.image}">
                        <div class="card-titles">
                            <div class="card-main-title">${song.name}</div>
                            <div class="card-sub-artist">${song.artist}</div>
                        </div>
                    </div>
                    <i class="fas fa-play-circle" style="color:var(--paper); font-size: 20px;"></i>
                `;
                list.appendChild(card);
            });
        }
    </script>
</body>
</html>
